services:
  - type: web
    name: zynora
    runtime: docker
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: ZYNORA_SECRET, generateValue: true }
      - { key: MONGODB_URI, sync: false }
      - { key: MONGODB_DB_NAME, value: zynora }
      - { key: CORS_ORIGIN, sync: false }
