<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zynora - Zyngram Internal Assistant</title>
<link rel="icon" href="./assets/zyngram_logo1.ico" type="image/x-icon">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  :root { --zy-navy:#142850; --zy-navy-2:#1d3a73; --zy-accent:#2f6fed; --zy-bg:#f1f4fa; }
  body { background:var(--zy-bg); color:#1c2430; font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; }
  .zy-navbar { background:linear-gradient(90deg,var(--zy-navy),var(--zy-navy-2)); box-shadow:0 2px 12px rgba(20,40,80,.25); }
  .zy-logo { height:40px; width:40px; object-fit:contain; background:#fff; border-radius:10px; padding:4px; }
  .zy-brand-title { font-weight:700; letter-spacing:.2px; line-height:1.1; }
  .zy-brand-sub { font-size:11px; opacity:.75; font-weight:400; }
  .zy-navbar .nav-link { color:rgba(255,255,255,.8); border-radius:8px; padding:.45rem .85rem; cursor:pointer; }
  .zy-navbar .nav-link:hover { color:#fff; background:rgba(255,255,255,.12); }
  .zy-navbar .nav-link.active { color:var(--zy-navy); background:#fff; font-weight:600; }
  .card { border:0; border-radius:14px; box-shadow:0 2px 10px rgba(20,40,80,.07); }
  .conv-list { max-height:calc(100vh - 290px); min-height:120px; overflow-y:auto; }
  .conv { padding:10px 12px; border-radius:10px; border:1px solid transparent; background:#f5f7fb; margin-bottom:6px; cursor:pointer; transition:background .15s; }
  .conv:hover { background:#e8eefb; }
  .conv.active { background:#e6eeff; border-color:var(--zy-accent); }
  .conv-title { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv-date { font-size:11px; color:#7a8497; }
  .conv .btn { --bs-btn-padding-y:.1rem; --bs-btn-padding-x:.45rem; --bs-btn-font-size:.72rem; }
  .chat-window { height:calc(100vh - 380px); min-height:340px; overflow-y:auto; background:#f8faff; border:1px solid #e3e9f5; border-radius:12px; padding:16px; }
  .row-msg { display:flex; gap:10px; margin-bottom:14px; align-items:flex-start; }
  .row-msg.user { flex-direction:row-reverse; }
  .avatar { flex:0 0 34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .avatar.bot { background:#fff; border:1px solid #dbe3f3; overflow:hidden; }
  .avatar.bot img { width:22px; height:22px; object-fit:contain; }
  .avatar.user { background:var(--zy-navy); color:#fff; }
  .bubble { max-width:78%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .bubble.user { background:var(--zy-navy); color:#fff; border-top-right-radius:4px; }
  .bubble.bot { background:#fff; border:1px solid #e1e8f5; border-top-left-radius:4px; }
  .bubble.bot.ungrounded { background:#fff4ea; border-color:#f0c29b; }
  .src-chip { display:inline-block; font-size:11px; background:#eef3ff; color:#2a4a9a; border-radius:20px; padding:2px 10px; margin:4px 6px 0 0; white-space:normal; }
  .meta { font-size:11px; color:#7a8497; margin-top:6px; white-space:normal; }
  .empty { text-align:center; color:#8892a6; padding:36px 10px; font-size:14px; }
  .empty i { font-size:34px; display:block; margin-bottom:8px; color:#b5c2de; }
  .badge-status { font-weight:500; }
  .stat { border-left:4px solid var(--zy-accent); }
  .stat .v { font-size:24px; font-weight:700; }
  .bar { background:var(--zy-accent); height:12px; border-radius:6px; }
  textarea.form-control { min-height:110px; }
  .btn-zy { background:var(--zy-navy); border-color:var(--zy-navy); color:#fff; }
  .btn-zy:hover { background:var(--zy-navy-2); border-color:var(--zy-navy-2); color:#fff; }
  *:focus-visible { outline:2px solid var(--zy-accent); outline-offset:2px; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark zy-navbar sticky-top">
  <div class="container-xl">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#" onclick="setView('chat');return false;">
      <img src="./assets/zyngram_logo1.png" class="zy-logo" alt="Zyngram logo" onerror="this.style.display='none'">
      <span class="d-flex flex-column">
        <span class="zy-brand-title">Zynora</span>
        <span class="zy-brand-sub">Zyngram Internal Assistant &nbsp;v1.1</span>
      </span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Toggle menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-md-center gap-1" id="nav"></ul>
    </div>
  </div>
</nav>

<main class="container-xl py-4" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Same-origin when served by the backend (production); localhost:5050 when opened as a file.
const API_BASE = window.ZYNORA_API_BASE ||
  (location.protocol === "file:" ? "http://localhost:5050" : location.origin);
const LOGO = "./assets/zyngram_logo1.png";

let state = {
  view: "chat",
  token: localStorage.getItem("zynora_token") || null,
  role: localStorage.getItem("zynora_role") || null,
  userId: localStorage.getItem("zynora_user_id") || null,
  sessionId: localStorage.getItem("zynora_last_conv") || null,
  conversations: [],
  chatLog: [],
  loading: false
};

/* ---------- API ---------- */
async function api(path, { method = "GET", body } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed.");
  return data;
}

/* ---------- Render / Nav ---------- */
function render() {
  renderNav();
  const app = document.getElementById("app");
  if (state.view === "login") app.innerHTML = loginView();
  else if (state.view === "register") app.innerHTML = registerView();
  else if (state.view === "admin") renderAdminView(app);
  else if (state.view === "monitor") renderMonitorView(app);
  else renderChatPage(app);
  if (state.view === "chat") setTimeout(scrollChatToBottom, 0);
}

function renderNav() {
  const item = (v, icon, label) =>
    `<li class="nav-item"><a class="nav-link ${state.view === v ? "active" : ""}" onclick="setView('${v}')"><i class="bi ${icon} me-1"></i>${label}</a></li>`;
  document.getElementById("nav").innerHTML =
    item("chat", "bi-chat-dots", "Chat") +
    (state.role === "admin"
      ? item("admin", "bi-journal-text", "Knowledge Panel") + item("monitor", "bi-activity", "Monitoring")
      : "") +
    (state.token
      ? `<li class="nav-item ms-md-2"><button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout (${escapeHtml(state.role || "")})</button></li>`
      : item("login", "bi-person-lock", "Staff / Admin Login"));
}

function setView(view) {
  state.view = view;
  render();
  const m = document.getElementById("navMenu");
  if (m && m.classList.contains("show")) bootstrap.Collapse.getOrCreateInstance(m).hide();
  if (view === "chat" && state.token) loadConversations();
}

function logout() {
  state.token = state.role = state.userId = state.sessionId = null;
  state.conversations = []; state.chatLog = [];
  ["zynora_token", "zynora_role", "zynora_user_id", "zynora_last_conv"].forEach(k => localStorage.removeItem(k));
  state.view = "chat";
  render();
}

/* ---------- Chat page ---------- */
function renderChatPage(app) {
  const disabled = !state.sessionId || !state.token ? "disabled" : "";
  app.innerHTML = `
  <div class="row g-3">
    <div class="col-lg-4 col-xl-3">
      <div class="card"><div class="card-body">
        <h6 class="fw-bold mb-3"><i class="bi bi-chat-square-text me-2"></i>Conversations</h6>
        ${state.token
          ? `<button class="btn btn-zy w-100 mb-3" onclick="createConversation()"><i class="bi bi-plus-lg me-1"></i>New conversation</button>`
          : `<div class="alert alert-info py-2 small">Log in to create and save conversations.</div>`}
        <div id="conversationList" class="conv-list"><div class="empty">${state.token ? "Loading conversations..." : "No conversations"}</div></div>
      </div></div>
    </div>
    <div class="col-lg-8 col-xl-9">
      <div class="card"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <h5 class="mb-0 fw-bold">${escapeHtml(getCurrentConversationTitle())}</h5>
            <div class="text-muted small">${state.sessionId ? "Persistent conversation" : "Create a conversation to start"}</div>
          </div>
          ${state.sessionId ? `<button class="btn btn-sm btn-outline-secondary" onclick="clearConversation()"><i class="bi bi-eraser me-1"></i>Clear</button>` : ""}
        </div>
        <div class="alert alert-light border small py-2 mb-3"><i class="bi bi-shield-check text-success me-1"></i>Zynora answers only from Zyngram's approved, active knowledge base. Ask in English, Hindi or Telugu. It never guesses and never uses the internet.</div>
        <div class="chat-window" id="chatWindow">
          ${state.chatLog.length === 0
            ? `<div class="empty"><i class="bi bi-stars"></i>${state.sessionId ? "Ask your first question." : "Create a new conversation first."}</div>`
            : state.chatLog.map(renderMsg).join("")}
        </div>
        <div class="input-group mt-3">
          <input type="text" class="form-control form-control-lg" id="chatInput" autocomplete="off"
            placeholder="${state.sessionId ? "Ask Zynora something..." : "Create a conversation first"}" ${disabled}
            onkeydown="if(event.key==='Enter')sendChat()" />
          <button class="btn btn-zy px-4" onclick="sendChat()" ${disabled}><i class="bi bi-send-fill"></i><span class="d-none d-sm-inline ms-2">Send</span></button>
        </div>
        <div class="small text-muted mt-2" id="chatStatus"></div>
      </div></div>
    </div>
  </div>`;
  if (state.token) loadConversations();
}

/* ---------- Conversations ---------- */
async function loadConversations() {
  if (!state.token) return;
  try {
    state.conversations = await api("/api/zynora/conversations");
    renderConversationList();
    if (state.sessionId) {
      if (state.conversations.some(c => c.id === state.sessionId)) {
        await loadConversation(state.sessionId, false);
      } else {
        state.sessionId = null;
        localStorage.removeItem("zynora_last_conv");
        state.chatLog = [];
        render();
      }
    }
  } catch (err) {
    const list = document.getElementById("conversationList");
    if (list) list.innerHTML = `<div class="text-danger small">${escapeHtml(err.message)}</div>`;
  }
}

function renderConversationList() {
  const list = document.getElementById("conversationList");
  if (!list) return;
  if (!state.conversations.length) { list.innerHTML = `<div class="empty">No conversations yet.</div>`; return; }
  list.innerHTML = state.conversations.map(c => `
    <div class="conv ${c.id === state.sessionId ? "active" : ""}" onclick="loadConversation('${c.id}')">
      <div class="conv-title">${escapeHtml(c.title || "New conversation")}</div>
      <div class="conv-date">${formatDate(c.updatedAt || c.createdAt)}</div>
      <div class="mt-2 d-flex gap-1">
        <button class="btn btn-outline-secondary" onclick="event.stopPropagation();renameConversation('${c.id}')"><i class="bi bi-pencil"></i> Rename</button>
        <button class="btn btn-outline-danger" onclick="event.stopPropagation();deleteConversation('${c.id}')"><i class="bi bi-trash"></i> Delete</button>
      </div>
    </div>`).join("");
}

async function createConversation() {
  if (!state.token) { setView("login"); return; }
  try {
    const conversation = await api("/api/zynora/conversations", { method: "POST", body: { title: "New conversation" } });
    state.sessionId = conversation.id;
    localStorage.setItem("zynora_last_conv", state.sessionId);
    state.chatLog = [];
    await loadConversations();
    render();
  } catch (err) { alert("Could not create conversation: " + err.message); }
}

async function loadConversation(conversationId, rerender = true) {
  try {
    state.sessionId = conversationId;
    localStorage.setItem("zynora_last_conv", conversationId);
    const history = await api(`/api/zynora/conversations/${encodeURIComponent(conversationId)}`);
    state.chatLog = (history || []).map(item => ({
      role: item.role === "user" ? "user" : "bot",
      text: item.message || "",
      sources: item.sources || [],
      grounded: item.grounded !== false,
      confidence: item.confidence,
      responseTimeMs: item.responseTimeMs
    }));
    if (rerender) render();
  } catch (err) { alert("Could not load conversation: " + err.message); }
}

async function renameConversation(id) {
  const c = state.conversations.find(c => c.id === id);
  const title = prompt("Enter conversation title:", c?.title || "New conversation");
  if (title === null) return;
  if (!title.trim()) { alert("Title is required."); return; }
  try {
    await api(`/api/zynora/conversations/${encodeURIComponent(id)}`, { method: "PATCH", body: { title: title.trim() } });
    await loadConversations();
    render();
  } catch (err) { alert("Could not rename conversation: " + err.message); }
}

async function deleteConversation(id) {
  const c = state.conversations.find(c => c.id === id);
  if (!confirm(`Delete "${c?.title || "this conversation"}"?\n\nThis will delete the conversation and its chat history.`)) return;
  try {
    await api(`/api/zynora/conversations/${encodeURIComponent(id)}`, { method: "DELETE" });
    if (state.sessionId === id) {
      state.sessionId = null; state.chatLog = [];
      localStorage.removeItem("zynora_last_conv");
    }
    await loadConversations();
    render();
  } catch (err) { alert("Could not delete conversation: " + err.message); }
}

async function clearConversation() {
  if (!state.sessionId) return;
  if (!confirm("Clear all messages from this conversation?")) return;
  try {
    await api(`/api/zynora/conversations/${encodeURIComponent(state.sessionId)}/clear`, { method: "POST" });
    state.chatLog = [];
    render();
  } catch (err) { alert("Could not clear conversation: " + err.message); }
}

/* ---------- Messages ---------- */
function renderMsg(m) {
  if (m.role === "user") {
    return `<div class="row-msg user"><div class="avatar user"><i class="bi bi-person-fill"></i></div><div class="bubble user">${escapeHtml(m.text)}</div></div>`;
  }
  const sources = (m.sources || []).map(s =>
    `<span class="src-chip"><i class="bi bi-file-earmark-text me-1"></i>${escapeHtml(s.title || "Knowledge source")}${s.category ? ` (${escapeHtml(s.category)})` : ""}</span>`).join("");
  const meta = m.responseTimeMs
    ? `<div class="meta">Confidence: ${escapeHtml(m.confidence || "N/A")} | Response time: ${Number(m.responseTimeMs)} ms${m.language ? " | Language: " + escapeHtml(m.language.toUpperCase()) : ""}${m.usedContext ? " | Used conversation context" : ""} | ${m.grounded ? "Grounded" : "Not grounded"}</div>` : "";
  return `<div class="row-msg"><div class="avatar bot"><img src="${LOGO}" alt="" onerror="this.replaceWith(document.createTextNode('Z'))"></div>` +
    `<div class="bubble bot ${m.grounded ? "" : "ungrounded"}">${escapeHtml(m.text)}${sources ? `<div class="mt-2 pt-2 border-top"><div class="small fw-semibold text-muted">Sources</div>${sources}</div>` : ""}${meta}</div></div>`;
}

function scrollChatToBottom() {
  const el = document.getElementById("chatWindow");
  if (el) el.scrollTop = el.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  if (!state.token) { alert("Please login first."); setView("login"); return; }
  if (!state.sessionId) { alert("Please create a conversation first."); return; }

  state.chatLog.push({ role: "user", text });
  input.value = "";
  render();
  const status = document.getElementById("chatStatus");
  if (status) status.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Zynora is thinking...`;

  try {
    const r = await api("/api/zynora/chat", { method: "POST", body: { message: text, conversationId: state.sessionId } });
    state.chatLog.push({
      role: "bot", text: r.answer, sources: r.sources || [], grounded: r.grounded,
      confidence: r.confidence, responseTimeMs: r.responseTimeMs, usedContext: r.usedContext, language: r.language
    });
    await loadConversations();
  } catch (err) {
    state.chatLog.push({ role: "bot", text: "Error: " + err.message, grounded: false });
  }
  render();
}

/* ---------- Login ---------- */
function loginView() {
  return `
  <div class="row justify-content-center"><div class="col-md-6 col-lg-4">
    <div class="card mt-4"><div class="card-body p-4">
      <div class="text-center mb-3">
        <img src="${LOGO}" alt="Zyngram" style="height:64px" onerror="this.style.display='none'">
        <h4 class="fw-bold mt-2 mb-1">Staff / Admin Login</h4>
        <p class="text-muted small mb-0">Login is required to create and access persistent conversations.</p>
      </div>
      <form onsubmit="doLogin(event)" class="d-grid gap-3">
        <div class="form-floating"><input type="email" class="form-control" id="loginEmail" placeholder="Email" required><label for="loginEmail">Email</label></div>
        <div class="form-floating"><input type="password" class="form-control" id="loginPassword" placeholder="Password" required><label for="loginPassword">Password</label></div>
        <button class="btn btn-zy btn-lg" type="submit">Login</button>
        <div class="text-danger small" id="loginError"></div>
      </form>
      ${authNotice ? `<div class="alert alert-success small py-2 mt-3 mb-0">${escapeHtml(authNotice)}</div>` : ""}
      <hr class="my-3">
      <div class="text-center small">New to Zynora?
        <a href="#" class="fw-semibold" onclick="authNotice='';setView('register');return false;">Create an account</a>
      </div>
    </div></div>
  </div></div>`;
}

async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  try {
    const r = await api("/api/auth/login", { method: "POST", body: { email, password } });
    state.token = r.token;
    state.role = r.user.role;
    state.userId = r.user.id || r.user.userId || null;
    localStorage.setItem("zynora_token", state.token);
    localStorage.setItem("zynora_role", state.role);
    if (state.userId) localStorage.setItem("zynora_user_id", state.userId);
    state.sessionId = localStorage.getItem("zynora_last_conv") || null;
    state.chatLog = [];
    state.view = state.role === "admin" ? "admin" : "chat";
    render();
  } catch (err) {
    const el = document.getElementById("loginError");
    if (el) el.textContent = err.message;
  }
}

/* ---------- Register ---------- */
let authNotice = "";

function registerView() {
  return `
  <div class="row justify-content-center"><div class="col-md-7 col-lg-5 col-xl-4">
    <div class="card mt-4"><div class="card-body p-4">
      <div class="text-center mb-3">
        <img src="${LOGO}" alt="Zyngram" style="height:64px" onerror="this.style.display='none'">
        <h4 class="fw-bold mt-2 mb-1">Create account</h4>
        <p class="text-muted small mb-0">Fill in your details to register.</p>
      </div>
      <form onsubmit="doRegister(event)" class="d-grid gap-3">
        <div class="form-floating"><input type="text" class="form-control" id="regName" placeholder="Full name" minlength="2" required><label for="regName">Full name</label></div>
        <div class="form-floating"><input type="email" class="form-control" id="regEmail" placeholder="Email" required><label for="regEmail">Email</label></div>
        <div class="form-floating"><input type="tel" class="form-control" id="regMobile" placeholder="Mobile number" inputmode="numeric" pattern="[0-9+\\-\\s]{10,15}" title="Enter a valid mobile number (10 to 15 digits)" required><label for="regMobile">Mobile number</label></div>
        <div class="form-floating"><input type="password" class="form-control" id="regPassword" placeholder="Password" minlength="8" required><label for="regPassword">Password (min 8 characters)</label></div>
        <button class="btn btn-zy btn-lg" type="submit" id="regBtn">Register</button>
        <div class="text-danger small" id="regError"></div>
      </form>
      <hr class="my-3">
      <div class="text-center small">Already have an account?
        <a href="#" class="fw-semibold" onclick="setView('login');return false;">Login</a>
      </div>
    </div></div>
  </div></div>`;
}

async function doRegister(e) {
  e.preventDefault();
  const g = id => document.getElementById(id).value.trim();
  const btn = document.getElementById("regBtn");
  const errEl = document.getElementById("regError");
  btn.disabled = true;
  errEl.textContent = "";
  try {
    const r = await api("/api/auth/register", {
      method: "POST",
      body: { name: g("regName"), email: g("regEmail"), mobile: g("regMobile"), password: document.getElementById("regPassword").value }
    });
    authNotice = r.message || "Registration successful. Please login.";
    setView("login");
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
  }
}

/* ---------- Admin ---------- */
let adminDocs = [];
let adminFilter = { status: "", category: "" };
const CATEGORIES = ["Company", "Services", "Franchise", "Policies", "FAQ"];
const FORMATS = ["txt", "markdown", "json"];
const LANGS = { en: "English", hi: "Hindi (हिंदी)", te: "Telugu (తెలుగు)" };
const STATUS_CLASS = { DRAFT: "bg-secondary", APPROVED: "bg-warning text-dark", ACTIVE_IN_RAG: "bg-success", ARCHIVED: "bg-danger" };

function docForm(p, d, submitFn, submitLabel, extra = "") {
  d = d || {};
  return `
  <form class="row g-2" onsubmit="${submitFn}">
    <div class="col-md-6"><input type="text" class="form-control" id="${p}Title" placeholder="Title" value="${escapeHtml(d.title || "")}" required></div>
    <div class="col-md-6"><select class="form-select" id="${p}Category" required>
      <option value="">Category...</option>
      ${CATEGORIES.map(c => `<option ${c === d.category ? "selected" : ""}>${c}</option>`).join("")}
    </select></div>
    <div class="col-md-6"><input type="text" class="form-control" id="${p}Version" placeholder="Version (e.g. v1)" value="${escapeHtml(d.version || "")}"></div>
    <div class="col-md-6"><select class="form-select" id="${p}Format">
      ${FORMATS.map(f => `<option value="${f}" ${f === d.format ? "selected" : ""}>${f}</option>`).join("")}
    </select></div>
    <div class="col-md-6"><select class="form-select" id="${p}Language" title="Language of this document's content">
      ${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === (d.language || "en") ? "selected" : ""}>${v}</option>`).join("")}
    </select></div>
    <div class="col-12"><textarea class="form-control" id="${p}Content" placeholder="Approved content text..." required>${escapeHtml(d.rawContent || "")}</textarea></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-zy" type="submit">${submitLabel}</button>${extra}</div>
  </form>`;
}

function readDocForm(p) {
  const g = id => document.getElementById(p + id).value;
  return { title: g("Title"), category: g("Category"), version: g("Version") || "v1", format: g("Format"), language: g("Language"), rawContent: g("Content") };
}

async function renderAdminView(app) {
  app.innerHTML = `
  <div class="card mb-3"><div class="card-body">
    <h5 class="fw-bold mb-3"><i class="bi bi-file-earmark-plus me-2"></i>Add knowledge document <span class="badge bg-secondary ms-1">starts as DRAFT</span></h5>
    ${docForm("doc", null, "createDoc(event)", "Create as draft")}
    <div class="text-danger small mt-2" id="adminError"></div>
  </div></div>

  <div class="card mb-3"><div class="card-body">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <div>
        <h5 class="fw-bold mb-1"><i class="bi bi-collection me-2"></i>Knowledge base</h5>
        <div class="text-muted small">Lifecycle: Draft → Approved → Active in RAG → Archived</div>
      </div>
      <select class="form-select w-auto" onchange="adminFilter.status=this.value;loadDocs()">
        <option value="">All statuses</option><option>DRAFT</option><option>APPROVED</option><option>ACTIVE_IN_RAG</option><option>ARCHIVED</option>
      </select>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Title</th><th>Category</th><th>Language</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="docRows"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>
  </div></div>

  <div class="card" id="editPanel" style="display:none"></div>`;
  await loadDocs();
}

async function openEditDoc(id) {
  const panel = document.getElementById("editPanel");
  panel.style.display = "block";
  panel.innerHTML = `<div class="card-body">Loading document...</div>`;
  try {
    const doc = await api(`/api/knowledge/${encodeURIComponent(id)}`);
    panel.innerHTML = `<div class="card-body">
      <h5 class="fw-bold">Edit: ${escapeHtml(doc.title)}</h5>
      <div class="alert alert-warning small py-2">Saving sends this document back to DRAFT. It must be approved and activated again before Zynora uses the new text.</div>
      ${docForm("edit", doc, `saveEditDoc(event,'${doc.id}')`, "Save changes", `<button type="button" class="btn btn-outline-secondary" onclick="closeEditDoc()">Cancel</button>`)}
      <div class="text-danger small mt-2" id="editError"></div>
    </div>`;
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    panel.innerHTML = `<div class="card-body text-danger">${escapeHtml(err.message)}</div>`;
  }
}

function closeEditDoc() {
  const panel = document.getElementById("editPanel");
  panel.style.display = "none";
  panel.innerHTML = "";
}

async function saveEditDoc(e, id) {
  e.preventDefault();
  try {
    await api(`/api/knowledge/${encodeURIComponent(id)}`, { method: "PUT", body: readDocForm("edit") });
    closeEditDoc();
    await loadDocs();
  } catch (err) { document.getElementById("editError").textContent = err.message; }
}

async function loadDocs() {
  const rows = document.getElementById("docRows");
  try {
    const qs = adminFilter.status ? `?status=${encodeURIComponent(adminFilter.status)}` : "";
    adminDocs = await api("/api/knowledge" + qs);
    if (!rows) return;
    if (!adminDocs.length) { rows.innerHTML = `<tr><td colspan="5" class="text-muted">No documents found.</td></tr>`; return; }
    const btn = (fn, id, label, cls = "btn-outline-primary") => `<button class="btn btn-sm ${cls}" onclick="${fn}('${id}')">${label}</button>`;
    rows.innerHTML = adminDocs.map(d => `
      <tr>
        <td class="fw-semibold">${escapeHtml(d.title)}</td>
        <td>${escapeHtml(d.category)}</td>
        <td><span class="badge text-bg-light border">${escapeHtml((d.language || "en").toUpperCase())}</span></td>
        <td><span class="badge badge-status ${STATUS_CLASS[d.status] || "bg-dark"}">${escapeHtml(d.status)}</span></td>
        <td class="d-flex flex-wrap gap-1">
          ${btn("openEditDoc", d.id, "Edit", "btn-outline-secondary")}
          ${d.status === "DRAFT" ? btn("approveDoc", d.id, "Approve") : ""}
          ${d.status === "APPROVED" ? btn("activateDoc", d.id, "Activate in RAG", "btn-outline-success") : ""}
          ${d.status === "ACTIVE_IN_RAG" ? btn("archiveDoc", d.id, "Archive", "btn-outline-danger") : ""}
          ${d.status === "ARCHIVED" ? btn("restoreDoc", d.id, "Restore to draft") : ""}
        </td>
      </tr>`).join("");
  } catch (err) {
    if (rows) rows.innerHTML = `<tr><td colspan="5" class="text-danger">${escapeHtml(err.message)}</td></tr>`;
  }
}

async function createDoc(e) {
  e.preventDefault();
  try {
    await api("/api/knowledge", { method: "POST", body: readDocForm("doc") });
    document.getElementById("docTitle").value = "";
    document.getElementById("docContent").value = "";
    document.getElementById("adminError").textContent = "";
    await loadDocs();
  } catch (err) { document.getElementById("adminError").textContent = err.message; }
}

async function docAction(id, action, label) {
  try {
    await api(`/api/knowledge/${encodeURIComponent(id)}/${action}`, { method: "POST" });
    await loadDocs();
  } catch (err) { alert(label + " failed: " + err.message); }
}
const approveDoc = id => docAction(id, "approve", "Approve");
const activateDoc = id => docAction(id, "activate", "Activation");
const archiveDoc = id => docAction(id, "archive", "Archive");
const restoreDoc = id => docAction(id, "restore", "Restore");

/* ---------- Monitoring (admin only) ---------- */
let monitorFilter = { from: "", to: "" };
let monitorTimer = null;

async function renderMonitorView(app) {
  app.innerHTML = `
  <div class="card"><div class="card-body">
    <h5 class="fw-bold mb-3"><i class="bi bi-activity me-2"></i>AI monitoring dashboard <small class="text-muted fw-normal ms-2" id="mVersion"></small></h5>
    <div class="row g-2 align-items-end mb-3">
      <div class="col-6 col-md-3"><label class="form-label small mb-1">From</label><input type="date" class="form-control" id="mFrom" value="${monitorFilter.from}"></div>
      <div class="col-6 col-md-3"><label class="form-label small mb-1">To</label><input type="date" class="form-control" id="mTo" value="${monitorFilter.to}"></div>
      <div class="col-12 col-md-6 d-flex gap-2">
        <button class="btn btn-zy" onclick="applyMonitorFilter()">Apply filter</button>
        <button class="btn btn-outline-secondary" onclick="clearMonitorFilter()">Clear</button>
        <button class="btn btn-outline-secondary" onclick="loadMonitor()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
    </div>
    <div class="text-danger" id="mError"></div>
    <div id="mCards"></div>
    <div id="mBody"></div>
  </div></div>`;
  clearInterval(monitorTimer);
  monitorTimer = setInterval(() => { if (state.view === "monitor") loadMonitor(); else clearInterval(monitorTimer); }, 15000);
  loadMonitor();
}

function applyMonitorFilter() {
  monitorFilter.from = document.getElementById("mFrom").value;
  monitorFilter.to = document.getElementById("mTo").value;
  loadMonitor();
}
function clearMonitorFilter() { monitorFilter = { from: "", to: "" }; renderMonitorView(document.getElementById("app")); }

async function loadMonitor() {
  const err = document.getElementById("mError");
  if (!err) return;
  try {
    const qs = new URLSearchParams();
    if (monitorFilter.from) qs.set("from", monitorFilter.from);
    if (monitorFilter.to) qs.set("to", monitorFilter.to);
    const [m, logs, quality, health] = await Promise.all([
      api("/api/admin/monitoring?" + qs),
      api("/api/admin/logs?limit=40"),
      api("/api/admin/quality?" + qs + "&limit=15"),
      api("/api/health")
    ]);
    err.textContent = "";
    document.getElementById("mVersion").textContent = "v" + health.version + " | DB: " + health.database + " (" + health.store + ")";
    const stat = (label, value, color) => `<div class="col-6 col-md-4 col-xl"><div class="card stat h-100"${color ? ` style="border-left-color:${color}"` : ""}><div class="card-body py-2"><div class="small text-muted">${label}</div><div class="v"${color ? ` style="color:${color}"` : ""}>${value}</div></div></div></div>`;
    const hc = { HEALTHY: "#0a7d33", DEGRADED: "#b26a00", DOWN: "#b00020" }[m.aiServiceHealth] || "#333";
    document.getElementById("mCards").innerHTML = `<div class="row g-2 mb-4">
      ${stat("Total Conversations", m.totalConversations)}${stat("Total Questions", m.totalQuestions)}
      ${stat("Successful Answers", m.successfulAnswers, "#0a7d33")}${stat("No-Answer Responses", m.noAnswerResponses, "#b26a00")}
      ${stat("Blocked Injections", m.blockedInjectionAttempts, "#b00020")}${stat("Retrieval Failures", m.retrievalFailures, "#b00020")}
      ${stat("Avg Response Time", m.avgResponseTimeMs + " ms")}${stat("Error Count", m.errorCount, "#b00020")}
      ${stat("Auth Failures", m.authFailures, "#b26a00")}${stat("AI Service Health", m.aiServiceHealth, hc)}
    </div>`;
    const days = Object.entries(m.dailyQuestions).sort();
    const maxDay = Math.max(1, ...days.map(d => d[1]));
    const td = v => `<td>${v}</td>`;
    const t = (rows, head) => `<div class="table-responsive"><table class="table table-sm table-hover align-middle"><thead class="table-light"><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("") || `<tr><td colspan="${head.length}" class="text-muted">No data</td></tr>`}</tbody></table></div>`;
    document.getElementById("mBody").innerHTML = `
      <h6 class="fw-bold">Daily questions</h6>
      ${days.map(([d, c]) => `<div class="d-flex gap-2 align-items-center small mb-1"><span style="width:90px">${d}</span><div class="bar" style="width:${Math.round(c / maxDay * 300)}px"></div><span>${c}</span></div>`).join("") || `<p class="text-muted">No questions in this range.</p>`}
      <h6 class="fw-bold mt-4">Frequently asked questions</h6>
      ${t(m.topQuestions.map(q => `<tr>${td(escapeHtml(q.question))}${td(q.count)}</tr>`), ["Question", "Count"])}
      <h6 class="fw-bold mt-4">Knowledge categories used</h6>
      ${t(m.knowledgeCategories.map(c => `<tr>${td(escapeHtml(c.category))}${td(c.count)}</tr>`), ["Category", "Answers"])}
      <h6 class="fw-bold mt-4">Recent AI responses (quality)</h6>
      ${t(quality.map(q => `<tr>${td(escapeHtml(q.question))}${td(q.status)}${td(q.grounded ? `<span class="badge bg-success">Grounded</span>` : `<span class="badge bg-warning text-dark">Not grounded</span>`)}${td(q.confidence)}${td(Number(q.similarity).toFixed(2))}${td(q.retrievedChunks)}${td(q.responseTimeMs + " ms")}${td(escapeHtml((q.sources || []).join(", ")))}</tr>`), ["Question", "Status", "Grounded", "Confidence", "Similarity", "Chunks", "Time", "Sources"])}
      <h6 class="fw-bold mt-4">Error / event logs (latest 40)</h6>
      ${t(logs.map(l => `<tr class="${l.level === "error" ? "table-danger" : l.level === "warn" ? "table-warning" : ""}">${td(l.timestamp.replace("T", " ").slice(0, 19))}${td(l.level)}${td(escapeHtml(l.module))}${td(escapeHtml(l.action))}${td(escapeHtml(l.status))}${td(escapeHtml(String(l.user).slice(0, 14)))}${td(escapeHtml(l.error || ""))}${td(`<code>${escapeHtml(l.traceId || "")}</code>`)}</tr>`), ["Time", "Level", "Module", "Action", "Status", "User", "Error", "Trace ID"])}`;
  } catch (e) { err.textContent = "Could not load monitoring data: " + e.message; }
}

/* ---------- Helpers ---------- */
function getCurrentConversationTitle() {
  if (!state.sessionId) return "Zynora Chat";
  const c = state.conversations.find(c => c.id === state.sessionId);
  return c?.title || "Zynora Chat";
}

function formatDate(value) {
  if (!value) return "";
  try { return new Date(value).toLocaleString(); } catch { return ""; }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

render();
</script>
</body>
</html>
